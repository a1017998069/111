  <defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto">
    <path d="M0,0 L16,7 L0,14 z" fill="#000"></path></marker></defs>

  <!-- 左侧阶段标签 -->
  <rect width="1040" height="870" fill="#fff"></rect>
