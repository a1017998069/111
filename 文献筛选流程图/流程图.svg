<?xml version="1.0" encoding="UTF-8"?>
<svg id="fig" width="1040" height="870" viewBox="0 0 1040 870" xmlns="http://www.w3.org/2000/svg">
  <style>
  text{font-family:"SimHei","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;font-size:21px;fill:#000}
